<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q1 Drill 2</title>
    <style>
        body{
            background-color: rgb(226, 226, 206);
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
        }
        header{
            text-align: center;
        }
        section{
            background-color: #fffeaa;
    	    padding: 20px;
    	    border-radius: 12px;
    	    width: 600px;
    	    margin: auto;
    	    box-shadow: 0 4px 10px rgba(80, 55, 11, 0.901);
        }
        img{
            display: block;
            margin: auto;
            height: 300px;
            width: 300px;
        }
    </style>
</head>
<body>
    <header>
        <h1>Rate a Movie!</h1>
             <br>
        <p>Write a movie review...</p>
    </header>

    <br>

    <section>
        <form action="">
            <img src="https://images.icon-icons.com/272/PNG/512/Movie_Studio_30032.png" alt="logo">
            <br>

            <label for="Movie">Movie Title</label>
            <input type="" id="Movie" name="Movie" placeholder="Enter here">

            <br>
            <label for="genre">Genre/s</label>
            <br>
            <input type="checkbox" id="genre1" name="Genre" value="Drama">
            <label for="genre1">Drama</label>

            <input type="checkbox" id="genre2" name="Genre" value="Comedy">
            <label for="genre1">Comedy</label>

            <input type="checkbox" id="genre3" name="Genre" value="Romance">
            <label for="genre1">Romance</label>

            <input type="checkbox" id="genre4" name="Genre" value="Action">
            <label for="genre1">Action</label>

            <input type="checkbox" id="genre5" name="Genre" value="Horror">
            <label for="genre1">Horror</label>

            <br>
            <label for="rating">Rating</label>
            <br>
            <input type="radio" id="rate1" name="rate" value="star1">
            <label for="rate1">⭐</label>

            <input type="radio" id="rate2" name="rate" value="star2">
            <label for="rate2">⭐⭐</label>

            <input type="radio" id="rate3" name="rate" value="star3">
            <label for="rate3">⭐⭐⭐</label>

            <input type="radio" id="rate4" name="rate" value="star4">
            <label for="rate4">⭐⭐⭐⭐</label>

            <input type="radio" id="rate5" name="rate" value="star5">
            <label for="rate5">⭐⭐⭐⭐⭐</label>

            <br>
            <textarea id="review" name="review" placeholder="Write a review.." rows="5" cols="40"></textarea>
            <br>

            <input type="submit" id="submit" name="submit" value="Submit Review">
            <br>

            For movie review tips, click<a href="https://www.nyfa.edu/student-resources/9-tips-for-writing-a-film-review/
" target=""> here</a>

        </form>
    </section>

      <!--Reference
	Nyfa, & Nyfa. (2024, March 23). How to write a movie review: 10     essential tips. NYFA. https://www.nyfa.edu/student-resources/9-tips-for-writing-a-film-review/
    -->
</body>
</html>
